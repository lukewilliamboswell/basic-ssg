name: Release

on:
  workflow_dispatch:
    inputs:
      nightly_validation:
        description: "Validate a nightly candidate without publishing or deploying"
        type: boolean
        required: false
        default: false
      release_version:
        description: "Release version, for example 1.0.0 or 1.0.0-rc1"
        required: false
        type: string
  pull_request:

permissions: {}

env:
  ROC_CACHE_DIR: ${{ github.workspace }}/.roc-cache

concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' && !inputs.nightly_validation) && format('release-{0}', github.repository) || format('release-validate-{0}-{1}', github.repository, github.ref) }}
  cancel-in-progress: ${{ (github.event_name != 'workflow_dispatch' || inputs.nightly_validation) }}

jobs:
  rust-version:
    name: Read Rust version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - name: Require a version for publication
        if: github.event_name == 'workflow_dispatch' && !inputs.nightly_validation
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: test -n "$RELEASE_VERSION" || { echo "A release version is required for publication" >&2; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: read
        run: |
          version=$(sed -n 's/^channel = "\(.*\)".*/\1/p' rust-toolchain.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-windows-host:
    name: Build Windows x64 host
    needs: rust-version
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        run: |
          rustup toolchain install "${{ needs.rust-version.outputs.version }}" --profile minimal --target x86_64-pc-windows-msvc
          rustup default "${{ needs.rust-version.outputs.version }}"

      - name: Build Windows host
        run: python scripts/build.py

      - name: Upload Windows host
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-x64-host
          path: platform/targets/x64win/*.lib
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build and validate release bundle
    needs: [rust-version, build-windows-host]
    runs-on: macos-15
    permissions:
      contents: read
    outputs:
      release_version: ${{ steps.validate.outputs.release_version }}
      docs_version: ${{ steps.validate.outputs.docs_version }}
      test_matrix: ${{ steps.bundles.outputs.test_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Require immutable release dependencies
        run: python3 scripts/check_release_ready.py

      - name: Enforce exact-nightly bootstrap release policy
        if: github.event_name == 'workflow_dispatch' && !inputs.nightly_validation
        uses: lukewilliamboswell/roc-automation/actions/check-release@355f762079f676df4d0ae86416edf34216b488e0
        with:
          version: ${{ inputs.release_version }}
          allow-default-branch: "true"
          allow-nightly-bootstrap: "true"
          compiler-root: platform/main.roc

      - name: Install Roc
        uses: ./.github/actions/setup-roc

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0

      - name: Install Rust with cross-compilation targets
        run: |
          rustup toolchain install "${{ needs.rust-version.outputs.version }}" --profile minimal --component llvm-tools-preview \
            --target x86_64-apple-darwin --target aarch64-apple-darwin \
            --target x86_64-unknown-linux-musl --target aarch64-unknown-linux-musl
          rustup default "${{ needs.rust-version.outputs.version }}"

      - name: Download Windows host
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-x64-host
          path: platform/targets/x64win

      - name: Validate release request
        id: validate
        uses: roc-lang/release-package/actions/validate-release@bb018c8c96b439b9545db6c792adc0549cf01ee1
        with:
          release_version: ${{ (github.event_name == 'workflow_dispatch' && !inputs.nightly_validation) && inputs.release_version || '' }}
          dry_run: ${{ (github.event_name != 'workflow_dispatch' || inputs.nightly_validation) }}
          github_token: ${{ github.token }}

      - name: Validate release branch
        if: (github.event_name == 'workflow_dispatch' && !inputs.nightly_validation)
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "${GITHUB_REF_TYPE:-}" != "branch" ] || [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "Releases must be dispatched from the default branch: $DEFAULT_BRANCH" >&2
            exit 1
          fi

      - name: Build platform for all targets
        run: python3 scripts/build.py --all

      - name: Validate sources and the served bundle
        run: python3 scripts/test.py --no-build

      - name: Resolve previous release
        if: (github.event_name == 'workflow_dispatch' && !inputs.nightly_validation)
        id: previous
        uses: roc-lang/release-package/actions/resolve-previous-release@bb018c8c96b439b9545db6c792adc0549cf01ee1
        with:
          github_token: ${{ github.token }}

      - name: Check version bump
        uses: roc-lang/release-package/actions/run-bump-check@bb018c8c96b439b9545db6c792adc0549cf01ee1
        with:
          release_version: ${{ steps.validate.outputs.release_version }}
          dry_run: ${{ (github.event_name != 'workflow_dispatch' || inputs.nightly_validation) }}
          bump_check: warn
          bump_entrypoint: platform/main.roc
          previous_url: ${{ steps.previous.outputs.previous_url }}

      - name: Bundle platform
        run: python3 scripts/bundle.py --output-dir dist

      - name: Prepare release bundle metadata
        id: bundles
        uses: roc-lang/release-package/actions/prepare-bundles@bb018c8c96b439b9545db6c792adc0549cf01ee1
        with:
          bundle_glob: dist/*.tar.zst
          test_os_json: '["macos-26","macos-26-intel","ubuntu-24.04","ubuntu-24.04-arm","windows-2025"]'

      - name: Upload release bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-bundles
          path: .release/bundles/*
          if-no-files-found: error
          retention-days: 7

      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-metadata
          path: |
            .release/bump-output.txt
            .release/previous-url.txt
            .release/release-bundles.json
            .release/test-matrix.json
          if-no-files-found: error
          retention-days: 7

  test-bundles:
    name: Test ${{ matrix.bundle_name }} bundle (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.build.outputs.test_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Roc
        uses: ./.github/actions/setup-roc

      - name: Download release bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-bundles
          path: .release/test-bundles

      - name: Test release bundle (Unix)
        if: matrix.os != 'windows-2025'
        uses: roc-lang/release-package/actions/test-bundle@bb018c8c96b439b9545db6c792adc0549cf01ee1
        with:
          test_bundle_command: python3 scripts/test.py --bundle-path
          bundle_path: .release/test-bundles/${{ matrix.artifact_file }}
          bundle_name: ${{ matrix.bundle_name }}
          release_version: ${{ needs.build.outputs.release_version }}

      - name: Test release bundle (Windows)
        if: matrix.os == 'windows-2025'
        uses: roc-lang/release-package/actions/test-bundle@bb018c8c96b439b9545db6c792adc0549cf01ee1
        with:
          test_bundle_command: python scripts/test.py --bundle-path
          bundle_path: .release/test-bundles/${{ matrix.artifact_file }}
          bundle_name: ${{ matrix.bundle_name }}
          release_version: ${{ needs.build.outputs.release_version }}

  build-docs:
    name: Build docs archive
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Roc
        uses: ./.github/actions/setup-roc
      - name: Create docs staging tree
        run: mkdir -p docs-site
      - name: Snapshot docs staging tree
        uses: roc-lang/release-package/actions/docs-snapshot@bb018c8c96b439b9545db6c792adc0549cf01ee1
        with:
          docs_root: docs-site
      - name: Generate and validate versioned docs
        env:
          DOCS_VERSION: ${{ needs.build.outputs.docs_version }}
          ROC_DOCS_URL_ROOT: /basic-ssg/${{ needs.build.outputs.docs_version }}
        run: |
          set -euo pipefail
          roc docs --output="docs-site/$DOCS_VERSION" platform/main.roc
      - name: Validate docs
        uses: roc-lang/release-package/actions/docs-validate@bb018c8c96b439b9545db6c792adc0549cf01ee1
        with:
          docs_root: docs-site
          docs_version: ${{ needs.build.outputs.docs_version }}
      - name: Archive versioned docs
        env:
          DOCS_VERSION: ${{ needs.build.outputs.docs_version }}
        run: tar -czf docs.tar.gz -C docs-site "$DOCS_VERSION"
      - name: Upload docs archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: platform-docs
          path: docs.tar.gz
          if-no-files-found: error
          retention-days: 7

  bundle-required:
    name: Bundle required
    if: always()
    needs: [build, test-bundles, build-docs]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require release-candidate bundle validation
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          BUNDLES_RESULT: ${{ needs.test-bundles.result }}
          DOCS_RESULT: ${{ needs.build-docs.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$BUNDLES_RESULT" = success
          test "$DOCS_RESULT" = success

  publish-release:
    name: Publish GitHub release
    needs: [build, build-docs, test-bundles, bundle-required]
    if: (github.event_name == 'workflow_dispatch' && !inputs.nightly_validation)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download release bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-bundles
          path: .release/bundles

      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-metadata
          path: .release

      - name: Download docs archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: platform-docs

      - name: Make release notes
        uses: roc-lang/release-package/actions/make-release-notes@bb018c8c96b439b9545db6c792adc0549cf01ee1
        with:
          release_version: ${{ needs.build.outputs.release_version }}
          docs_url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ needs.build.outputs.docs_version }}/
          github_token: ${{ github.token }}

      - name: Publish release
        uses: roc-lang/release-package/actions/publish-release@bb018c8c96b439b9545db6c792adc0549cf01ee1
        with:
          release_version: ${{ needs.build.outputs.release_version }}
          additional_assets: docs.tar.gz
          github_token: ${{ github.token }}

  publish-docs:
    name: Publish docs and prepare release follow-up
    needs: [build, publish-release]
    if: (github.event_name == 'workflow_dispatch' && !inputs.nightly_validation)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
      statuses: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Roc
        uses: ./.github/actions/setup-roc

      - name: Download release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-metadata
          path: .release

      - name: Update public examples to the published bundle
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
        run: >-
          python3 scripts/update_app_platform_urls.py
          --release-manifest .release/release-bundles.json
          examples/article-inspector/main.roc
          examples/orchard-guide/main.roc
          examples/travel-journal/main.roc

      - name: Validate updated public examples
        run: python3 scripts/test.py --published --no-build --operation validate

      - name: Open and validate signed release follow-up PR
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/create_release_followup.py --version "${{ needs.build.outputs.release_version }}"

      - name: Assemble Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p pages-site
          cp -R www/. pages-site/
          python3 scripts/restore_release_docs.py pages-site
          ROC_DOCS_URL_ROOT=/basic-ssg/main roc docs --output=pages-site/main platform/main.roc
          python3 scripts/enhance_docs_site.py pages-site

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: pages-site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
