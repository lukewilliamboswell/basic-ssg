name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      nightly_validation:
        description: "Validate a nightly candidate without publishing or deploying"
        type: boolean
        required: false
        default: false

# this cancels workflows currently in progress if you start a new one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  ROC_CACHE_DIR: ${{ github.workspace }}/.roc-cache

jobs:
  release-examples:
    name: Release examples (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - macos-26-intel
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the Roc pinned by the release examples
        uses: ./.github/actions/setup-roc
        with:
          release-examples: "true"

      - name: Check, test, build, and run release examples
        run: ${{ runner.os == 'Windows' && 'python scripts/test.py --release --no-build' || 'python3 scripts/test.py --release --no-build' }}

  current-source:
    name: Current source (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26         # Apple Silicon
          - macos-26-intel   # Intel Mac
          - ubuntu-24.04     # Linux x86_64
          - ubuntu-24.04-arm # Linux ARM64
          - windows-2025     # Windows x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Roc
        uses: ./.github/actions/setup-roc

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      # The Windows runtime inputs are built with Zig 0.17.0; the Unix runtime
      # inputs stay on the reproducible 0.16.0.
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # ratchet:mlugg/setup-zig@v2.2.1
        with:
          version: ${{ runner.os == 'Windows' && '0.17.0' || '0.16.0' }}

      - name: Install Valgrind
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind

      - name: Run all tests
        if: matrix.os == 'ubuntu-24.04'
        run: python3 scripts/all_tests.py

      # RustGlue is target-independent. Validate it once on Linux because the
      # compiler's glue helper currently cannot link libSystem on macOS 26.
      - name: Run cross-platform tests
        if: runner.os != 'Windows' && matrix.os != 'ubuntu-24.04'
        run: >-
          python3 scripts/all_tests.py
          --section roc
          --section host
          --section examples
          --section docs

      - name: Run example behavior with Valgrind
        if: matrix.os == 'ubuntu-24.04'
        run: python3 scripts/all_tests.py --section examples --valgrind

      - name: Install Windows Rust components
        if: runner.os == 'Windows'
        run: |
          rustup target add x86_64-pc-windows-msvc
          rustup component add rust-docs llvm-tools-preview

      - name: Run all Windows tests
        if: runner.os == 'Windows'
        run: >-
          python scripts/all_tests.py
          --section roc
          --section host
          --section examples
          --section docs

  ci-required:
    name: CI required
    if: always()
    needs: [release-examples, current-source]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require every CI validation lane
        env:
          RELEASE_RESULT: ${{ needs.release-examples.result }}
          SOURCE_RESULT: ${{ needs.current-source.result }}
        run: |
          test "$RELEASE_RESULT" = success
          test "$SOURCE_RESULT" = success
