name: CI

on:
  pull_request:
  workflow_dispatch:

# this cancels workflows currently in progress if you start a new one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-and-test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Roc
        uses: roc-lang/setup-roc@e81ba5825caa1544545c783d4a02ae3155b5ab02
        with:
          version: nightly-new-compiler

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Install Zig
        if: runner.os != 'Windows'
        uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # ratchet:mlugg/setup-zig@v2.0.5
        with:
          version: 0.16.0

      - name: Run all tests
        if: runner.os != 'Windows'
        run: python3 scripts/all_tests.py

      - name: Install Windows Rust components
        if: runner.os == 'Windows'
        run: rustup target add x86_64-pc-windows-msvc

      - name: Run all Windows tests
        if: runner.os == 'Windows'
        run: python scripts/all_tests.py
