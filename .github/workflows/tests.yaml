name: CI

on:
  pull_request:
  workflow_dispatch:

# this cancels workflows currently in progress if you start a new one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-and-test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15         # Apple Silicon
          - macos-15-intel   # Intel Mac
          - ubuntu-22.04     # Linux x86_64
          - ubuntu-24.04-arm # Linux ARM64
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Temporary companion checkout for platform/main.roc's relative path
      # dependency. Remove this when the next roc-lang/path release URL lands.
      - name: Checkout roc-lang/path
        run: |
          git clone --filter=blob:none https://github.com/roc-lang/path.git ../path
          git -C ../path checkout cb60ad44894447a8dc2f5126f49e2b7e98609b2a

      - name: Install Roc
        uses: roc-lang/setup-roc@e81ba5825caa1544545c783d4a02ae3155b5ab02
        with:
          version: nightly-new-compiler

      - name: Install Zig
        uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # ratchet:mlugg/setup-zig@v2.0.5
        with:
          version: 0.16.0

      - name: Run all tests
        run: ./ci/all_tests.sh
