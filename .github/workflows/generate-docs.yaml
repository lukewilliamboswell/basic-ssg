name: Generate docs

on:
  # Run when a release is published
  release:
    types:
      - published

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate-docs:
    name: Generate docs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      # Temporary companion checkout for platform/main.roc's relative path
      # dependency. Remove this when the next roc-lang/path release URL lands.
      - name: Check out roc-lang/path
        run: |
          git clone --filter=blob:none https://github.com/roc-lang/path.git ../path
          git -C ../path checkout cb60ad44894447a8dc2f5126f49e2b7e98609b2a
      - name: Install Roc
        uses: roc-lang/setup-roc@e81ba5825caa1544545c783d4a02ae3155b5ab02
        with:
          version: nightly-new-compiler
      - name: Generate docs
        run: roc docs --output=generated-docs docs/basic-ssg.roc
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Fix absolute paths
        run: |
          find generated-docs/ -type f -name '*.html' -exec sed -i "s/\(href\|src\)=\"\//\1=\"\/${{ github.event.repository.name }}\//g" {} +
      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: generated-docs
      - name: Deploy docs
        id: deployment
        uses: actions/deploy-pages@v5
