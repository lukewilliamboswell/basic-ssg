name: Deploy site and docs to Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-docs.yml"
      - "platform/**"
      - "scripts/enhance_docs_site.py"
      - "scripts/restore_release_docs.py"
      - "www/**"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions: {}

jobs:
  deploy:
    name: Deploy site and docs
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Install Roc
        uses: ./.github/actions/setup-roc
      - name: Assemble Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p pages-site
          cp -R www/. pages-site/
          python3 scripts/restore_release_docs.py pages-site
          ROC_DOCS_URL_ROOT=/basic-ssg/main roc docs --output=pages-site/main platform/main.roc
          python3 scripts/enhance_docs_site.py pages-site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
