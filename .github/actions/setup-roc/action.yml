name: Install the pinned Roc compiler
description: Install the exact new-compiler nightly selected by this repository

inputs:
  use-latest:
    description: Install the latest nightly instead of the agreed Roc header pin
    required: false
    default: "false"
  release-examples:
    description: Install the compiler pinned by examples-release instead of the development pin
    required: false
    default: "false"

outputs:
  nightly-tag:
    description: The immutable nightly tag, or empty when use-latest is true
    value: ${{ steps.roc-version.outputs.nightly-tag }}

runs:
  using: composite
  steps:
    - name: Resolve the Roc nightly
      id: roc-version
      shell: bash
      env:
        USE_LATEST: ${{ inputs.use-latest }}
        RELEASE_EXAMPLES: ${{ inputs.release-examples }}
      run: |
        set -euo pipefail

        case "$RELEASE_EXAMPLES" in
          true) pin_flag="--release-examples" ;;
          false) pin_flag="" ;;
          *)
            echo "release-examples must be true or false, got: $RELEASE_EXAMPLES" >&2
            exit 1
            ;;
        esac

        case "$USE_LATEST" in
          true)
            nightly_tag=""
            echo "Installing the latest Roc nightly"
            ;;
          false)
            nightly_tag="$(python "$GITHUB_WORKSPACE/scripts/roc_version.py" --print-tag $pin_flag)"
            echo "Installing Roc $nightly_tag from the selected Roc headers"
            ;;
          *)
            echo "use-latest must be true or false, got: $USE_LATEST" >&2
            exit 1
            ;;
        esac

        printf 'nightly-tag=%s\n' "$nightly_tag" >> "$GITHUB_OUTPUT"

    - uses: roc-lang/setup-roc@e81ba5825caa1544545c783d4a02ae3155b5ab02
      with:
        version: nightly-new-compiler
        nightly-tag: ${{ steps.roc-version.outputs.nightly-tag }}
